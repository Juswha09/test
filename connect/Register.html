<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

		username
		<input id='user' type='text'>
		password
		<input id='pass' type='text'>
		confirm password
		<input id='confirmpass' type='text'>
		<button type="button" onclick="clickButton(
		 document.getElementById('user').value, 
		 document.getElementById('pass').value,
		 document.getElementById('confirmpass').value )
		 ">Register!</button>
		<button type="button" onclick="document.location.href = 'Login.html';">Log in</button>
		<script>


		const user = 'qwer';
		const pass = '1234'
		const confirmpass = '1234'


		const clickButton = (a,b,c) =>{

			const postData = {
				name:a,
				password:b,
				confirmpass:c,
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'Register.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
